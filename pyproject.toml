[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-bilingual-pdf"
version = "1.1.0"
description = "Chinese-first bilingual paper PDFs with reviewed, complete original equation and figure preservation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.26,<2"]

[project.optional-dependencies]
test = ["Pillow>=10"]

[project.scripts]
paper-bilingual = "paper_bilingual:main"

[tool.setuptools]
py-modules = ["paper_bilingual"]
package-dir = {"" = "scripts"}
